[project]
name = "grok-faf-voice"
version = "0.3.2"
description = "grok-faf-voice | VML • Voice Memory Layer for Grok • Persistent across sessions, devices, models • LiveKit-enabled"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wolfejam", email = "team@faf.one" }]
keywords = [
    # Brand / category we define
    "voice-memory-layer",
    "vml",
    "fafm",
    # Platforms
    "grok",
    "xai",
    "livekit",
    # Capability category
    "persistent-memory",
    "voice-agent",
    "tts",
    "custom-voices",
    "voice-cloning",
    # Differentiator
    "paralinguistic",
    # Protocol
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Conferencing",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "livekit-agents[xai]>=1.4",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "fastmcp>=4.0.0",
    "pydantic>=2.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "mypy>=1.0",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Wolfe-Jam/grok-faf-voice"
Repository = "https://github.com/Wolfe-Jam/grok-faf-voice"
Changelog = "https://github.com/Wolfe-Jam/grok-faf-voice/blob/main/CHANGELOG.md"
Issues = "https://github.com/Wolfe-Jam/grok-faf-voice/issues"
"claude-fafm-sdk (knowledge)" = "https://pypi.org/project/claude-fafm-sdk/"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grok_faf_voice*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
markers = [
    "network: tests that require live network access (e.g. MCPaaS)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.coverage.run]
source = ["grok_faf_voice"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
exclude = ["dist/", "build/", ".venv/", "tests/", "examples/"]

[[tool.mypy.overrides]]
module = ["livekit.*", "openai.*"]
ignore_missing_imports = true
